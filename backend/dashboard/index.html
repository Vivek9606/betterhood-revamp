<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="robots" content="noindex, nofollow" />
<title>betterhood analytics</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600..800&family=Figtree:wght@400..700&display=swap" />
<style>
  :root {
    color-scheme: light;
    --bg: #fbf7f1; --surface: #ffffff; --surface-2: #f5eaf2;
    --ink: #240c2c; --ink-soft: #5b4a5e; --ink-mute: #85758a;
    --line: #eadfe6; --line-strong: #d9c8d3; --grid: #efe6ec;
    --series: #7a2a6c; --series-soft: #ead6e5;
    --good: #0f7a43; --bad: #c4372a;
    --font-display: "Bricolage Grotesque", system-ui, sans-serif;
    --font-body: "Figtree", system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      color-scheme: dark;
      --bg: #140617; --surface: #1f0b24; --surface-2: #2c1232;
      --ink: #f5eaf2; --ink-soft: #d2c2cf; --ink-mute: #a08fa5;
      --line: #3a1e40; --line-strong: #4e2c55; --grid: #2e1634;
      --series: #d08cc2; --series-soft: #4a2246;
      --good: #4fcf8a; --bad: #ff8a7a;
    }
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --bg: #140617; --surface: #1f0b24; --surface-2: #2c1232;
    --ink: #f5eaf2; --ink-soft: #d2c2cf; --ink-mute: #a08fa5;
    --line: #3a1e40; --line-strong: #4e2c55; --grid: #2e1634;
    --series: #d08cc2; --series-soft: #4a2246;
    --good: #4fcf8a; --bad: #ff8a7a;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.5 var(--font-body); }
  a { color: inherit; }
  button, input, select { font: inherit; color: inherit; }
  .wrap { max-width: 1280px; margin: 0 auto; padding: 0 16px 64px; }
  header { position: sticky; top: 0; z-index: 5; background: color-mix(in srgb, var(--bg) 88%, transparent); backdrop-filter: blur(10px); border-bottom: 1px solid var(--line); }
  .bar { max-width: 1280px; margin: 0 auto; padding: 12px 16px; display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
  .brand { font: 800 20px var(--font-display); letter-spacing: -0.02em; margin-right: auto; }
  .brand small { font: 500 13px var(--font-body); color: var(--ink-mute); margin-left: 6px; }
  .live { font-size: 13px; color: var(--ink-soft); display: inline-flex; align-items: center; gap: 6px; }
  .live::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: var(--good); }
  nav { display: flex; gap: 4px; overflow-x: auto; max-width: 100%; }
  nav button { border: 0; background: none; padding: 8px 14px; border-radius: 999px; cursor: pointer; color: var(--ink-soft); white-space: nowrap; font-weight: 600; }
  nav button[aria-selected="true"] { background: var(--ink); color: var(--bg); }
  select, input[type=search] { background: var(--surface); border: 1px solid var(--line-strong); border-radius: 10px; padding: 8px 12px; min-height: 40px; }
  h2 { font: 700 18px var(--font-display); margin: 0 0 12px; letter-spacing: -0.01em; }
  h3 { font: 700 15px var(--font-body); margin: 0 0 10px; }
  .muted { color: var(--ink-mute); }
  .grid { display: grid; gap: 16px; margin-top: 16px; }
  .g2 { grid-template-columns: repeat(auto-fit, minmax(min(100%, 420px), 1fr)); }
  .g3 { grid-template-columns: repeat(auto-fit, minmax(min(100%, 300px), 1fr)); }
  .card { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 18px; min-width: 0; }
  .tiles { display: grid; gap: 12px; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); margin-top: 20px; }
  .tile { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 14px 16px; }
  .tile .k { font-size: 13px; color: var(--ink-soft); }
  .tile .v { font: 800 28px/1.2 var(--font-display); letter-spacing: -0.02em; margin-top: 2px; }
  .tile .d { font-size: 12.5px; color: var(--ink-mute); }
  .up { color: var(--good); } .down { color: var(--bad); }
  table { width: 100%; border-collapse: collapse; font-size: 14px; }
  th { text-align: left; font-weight: 600; color: var(--ink-mute); font-size: 12.5px; padding: 6px 8px; border-bottom: 1px solid var(--line); white-space: nowrap; }
  td { padding: 7px 8px; border-bottom: 1px solid var(--line); vertical-align: top; }
  td.n, th.n { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
  tr.click { cursor: pointer; } tr.click:hover td { background: var(--surface-2); }
  .scroll { overflow-x: auto; }
  .lbl { max-width: 360px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .barcell { position: relative; }
  .barcell .b { position: absolute; left: 0; top: 6px; bottom: 6px; background: var(--series-soft); border-radius: 0 4px 4px 0; z-index: 0; }
  .barcell span { position: relative; z-index: 1; padding-left: 6px; }
  .chip { display: inline-block; padding: 1px 8px; border-radius: 999px; background: var(--surface-2); font-size: 12px; color: var(--ink-soft); white-space: nowrap; }
  .chart { position: relative; }
  .chart svg { display: block; width: 100%; height: auto; overflow: visible; }
  .tip { position: absolute; pointer-events: none; background: var(--ink); color: var(--bg); padding: 6px 10px; border-radius: 8px; font-size: 13px; white-space: nowrap; transform: translate(-50%, -110%); opacity: 0; transition: opacity .1s; }
  .seg { display: inline-flex; border: 1px solid var(--line-strong); border-radius: 999px; padding: 2px; }
  .seg button { border: 0; background: none; padding: 4px 12px; border-radius: 999px; cursor: pointer; font-size: 13px; color: var(--ink-soft); }
  .seg button[aria-pressed="true"] { background: var(--surface-2); color: var(--ink); font-weight: 600; }
  .head { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; margin-bottom: 8px; }
  .funnel { display: grid; gap: 6px; }
  .frow { display: grid; grid-template-columns: 90px 1fr 70px; gap: 10px; align-items: center; font-size: 14px; }
  .ftrack { height: 22px; background: var(--grid); border-radius: 4px; overflow: hidden; }
  .ffill { height: 100%; background: var(--series); border-radius: 0 4px 4px 0; }
  .timeline { list-style: none; margin: 0; padding: 0; }
  .sess { border: 1px solid var(--line); border-radius: 14px; margin-bottom: 14px; overflow: hidden; }
  .sess > header { position: static; backdrop-filter: none; background: var(--surface-2); padding: 10px 14px; display: flex; gap: 8px; flex-wrap: wrap; align-items: center; border: 0; }
  .ev { display: grid; grid-template-columns: 70px 1fr; gap: 10px; padding: 6px 14px; border-top: 1px solid var(--line); font-size: 14px; }
  .ev time { color: var(--ink-mute); font-variant-numeric: tabular-nums; font-size: 13px; }
  .ev b { font-weight: 600; }
  .ev .p { color: var(--ink-soft); word-break: break-word; }
  .ev.key { background: color-mix(in srgb, var(--series-soft) 45%, transparent); }
  .empty { color: var(--ink-mute); padding: 18px 0; text-align: center; }
  .err { color: var(--bad); }
  pre { white-space: pre-wrap; word-break: break-word; font-size: 12.5px; margin: 4px 0 0; color: var(--ink-soft); }
  details summary { cursor: pointer; color: var(--ink-soft); font-size: 13px; }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<header>
  <div class="bar">
    <div class="brand">betterhood <small>visitor journeys</small></div>
    <span class="live" id="live">–</span>
    <select id="days" aria-label="Date range">
      <option value="1">Last 24 hours</option>
      <option value="7">Last 7 days</option>
      <option value="30" selected>Last 30 days</option>
      <option value="90">Last 90 days</option>
      <option value="365">Last 12 months</option>
    </select>
  </div>
  <div class="bar" style="padding-top:0">
    <nav role="tablist">
      <button role="tab" data-tab="overview" aria-selected="true">Overview</button>
      <button role="tab" data-tab="assessments">Assessments</button>
      <button role="tab" data-tab="behaviour">Behaviour</button>
      <button role="tab" data-tab="leads">Leads</button>
      <button role="tab" data-tab="sessions">Sessions</button>
      <button role="tab" data-tab="journey">Journey</button>
    </nav>
  </div>
</header>

<div class="wrap">
  <section data-panel="overview"></section>
  <section data-panel="assessments" hidden></section>
  <section data-panel="behaviour" hidden></section>
  <section data-panel="leads" hidden></section>
  <section data-panel="sessions" hidden></section>
  <section data-panel="journey" hidden>
    <form id="jform" class="card" style="margin-top:20px;display:flex;gap:10px;flex-wrap:wrap;align-items:center">
      <input type="search" id="jq" placeholder="Email or phone number" style="flex:1;min-width:220px" />
      <button class="seg" style="padding:8px 16px;cursor:pointer;background:var(--ink);color:var(--bg);border:0">Find person</button>
      <span class="muted" style="font-size:13px">…or click any lead or session to open its journey.</span>
    </form>
    <div id="jout"></div>
  </section>
</div>

<script>
const $ = (s, el = document) => el.querySelector(s);
const esc = (v) => String(v ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c]);
const num = (n) => Number(n ?? 0).toLocaleString("en-IN");
const dur = (ms) => { const s = Math.round((ms ?? 0) / 1000); return s < 60 ? `${s}s` : s < 3600 ? `${Math.floor(s / 60)}m ${s % 60}s` : `${Math.floor(s / 3600)}h ${Math.floor((s % 3600) / 60)}m`; };
const when = (t) => new Date(t).toLocaleString("en-IN", { day: "numeric", month: "short", hour: "2-digit", minute: "2-digit" });
const hhmm = (t) => new Date(t).toLocaleTimeString("en-IN", { hour: "2-digit", minute: "2-digit", second: "2-digit" });
const daysSel = $("#days");
const cache = {};

async function get(path) {
  const r = await fetch(`/api/${path}${path.includes("?") ? "&" : "?"}days=${daysSel.value}`, { credentials: "same-origin" });
  const j = await r.json();
  if (!r.ok) throw new Error(j.error || r.statusText);
  return j;
}

// ---------- small building blocks ----------
function delta(a, b, invert = false) {
  if (!b) return `<span class="d">no earlier data</span>`;
  const pct = Math.round(((a - b) / b) * 100);
  const good = invert ? pct < 0 : pct > 0;
  return `<span class="d ${pct === 0 ? "" : good ? "up" : "down"}">${pct > 0 ? "▲" : pct < 0 ? "▼" : "•"} ${Math.abs(pct)}% vs previous</span>`;
}
function tile(k, v, d = "") { return `<div class="tile"><div class="k">${k}</div><div class="v">${v}</div>${d}</div>`; }

// rows: [{...}], cols: [{k, label, n?, bar?, fmt?}], opts: {click: row => js}
function table(rows, cols, opts = {}) {
  if (!rows?.length) return `<div class="empty">No data yet for this period.</div>`;
  const max = {};
  cols.filter((c) => c.bar).forEach((c) => (max[c.k] = Math.max(...rows.map((r) => Number(r[c.k]) || 0), 1)));
  return `<div class="scroll"><table><thead><tr>${cols.map((c) => `<th class="${c.n ? "n" : ""}">${c.label}</th>`).join("")}</tr></thead><tbody>${rows
    .map((r, i) => `<tr ${opts.click ? `class="click" data-row="${i}"` : ""}>${cols
      .map((c) => {
        const raw = r[c.k];
        const v = c.fmt ? c.fmt(raw, r) : esc(raw ?? "–");
        if (c.bar) return `<td class="barcell"><div class="b" style="width:${(100 * (Number(raw) || 0)) / max[c.k]}%"></div><span class="lbl">${c.labelFmt ? c.labelFmt(r) : esc(r[c.labelKey] ?? "–")}</span></td>`;
        return `<td class="${c.n ? "n" : ""}${c.wrap ? "" : " lbl"}">${v}</td>`;
      })
      .join("")}</tr>`)
    .join("")}</tbody></table></div>`;
}
function wireRows(container, rows, fn) {
  container.querySelectorAll("tr[data-row]").forEach((tr) => tr.addEventListener("click", () => fn(rows[+tr.dataset.row])));
}

// Single-series line/area chart with crosshair tooltip
function lineChart(el, data, key, label) {
  const W = 800, H = 220, P = { l: 40, r: 12, t: 12, b: 26 };
  const max = Math.max(...data.map((d) => d[key]), 1);
  const nice = Math.pow(10, Math.floor(Math.log10(max))) * Math.ceil(max / Math.pow(10, Math.floor(Math.log10(max))));
  const x = (i) => P.l + (data.length < 2 ? 0 : (i * (W - P.l - P.r)) / (data.length - 1));
  const y = (v) => H - P.b - (v / nice) * (H - P.t - P.b);
  const pts = data.map((d, i) => `${x(i).toFixed(1)},${y(d[key]).toFixed(1)}`);
  const ticks = [0, 0.5, 1].map((f) => Math.round(nice * f));
  const every = Math.ceil(data.length / 8);
  el.innerHTML = `<div class="chart"><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(label)} per day">
    ${ticks.map((t) => `<line x1="${P.l}" x2="${W - P.r}" y1="${y(t)}" y2="${y(t)}" stroke="var(--grid)" /><text x="${P.l - 8}" y="${y(t) + 4}" text-anchor="end" font-size="11" fill="var(--ink-mute)">${num(t)}</text>`).join("")}
    ${data.map((d, i) => (i % every === 0 ? `<text x="${x(i)}" y="${H - 6}" text-anchor="middle" font-size="11" fill="var(--ink-mute)">${new Date(d.day).toLocaleDateString("en-IN", { day: "numeric", month: "short" })}</text>` : "")).join("")}
    <polygon points="${P.l},${H - P.b} ${pts.join(" ")} ${x(data.length - 1)},${H - P.b}" fill="var(--series)" opacity="0.12" />
    <polyline points="${pts.join(" ")}" fill="none" stroke="var(--series)" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" />
    <line class="xh" y1="${P.t}" y2="${H - P.b}" stroke="var(--line-strong)" opacity="0" />
    <circle class="dot" r="5" fill="var(--series)" stroke="var(--surface)" stroke-width="2" opacity="0" />
    <rect x="${P.l}" y="0" width="${W - P.l - P.r}" height="${H}" fill="transparent" class="hit" />
  </svg><div class="tip"></div></div>`;
  const svg = $("svg", el), tip = $(".tip", el), xh = $(".xh", el), dot = $(".dot", el);
  const move = (ev) => {
    const r = svg.getBoundingClientRect();
    const sx = ((ev.clientX - r.left) / r.width) * W;
    const i = Math.max(0, Math.min(data.length - 1, Math.round(((sx - P.l) / (W - P.l - P.r)) * (data.length - 1))));
    const d = data[i];
    xh.setAttribute("x1", x(i)); xh.setAttribute("x2", x(i)); xh.setAttribute("opacity", 1);
    dot.setAttribute("cx", x(i)); dot.setAttribute("cy", y(d[key])); dot.setAttribute("opacity", 1);
    tip.style.left = `${(x(i) / W) * 100}%`; tip.style.top = `${(y(d[key]) / H) * 100}%`; tip.style.opacity = 1;
    tip.textContent = `${new Date(d.day).toLocaleDateString("en-IN", { weekday: "short", day: "numeric", month: "short" })} · ${num(d[key])} ${label.toLowerCase()}`;
  };
  $(".hit", el).addEventListener("pointermove", move);
  $(".hit", el).addEventListener("pointerleave", () => { tip.style.opacity = 0; xh.setAttribute("opacity", 0); dot.setAttribute("opacity", 0); });
}

// ---------- Overview ----------
async function overview() {
  const el = $('[data-panel="overview"]');
  const d = await get("overview");
  $("#live").textContent = `${d.live} on site now`;
  const k = d.kpis, p = d.prev;
  el.innerHTML = `
    <div class="tiles">
      ${tile("Visitors", num(k.visitors), delta(k.visitors, p.visitors))}
      ${tile("Sessions", num(k.sessions), delta(k.sessions, p.sessions))}
      ${tile("Page views", num(k.page_views), delta(k.page_views, p.page_views))}
      ${tile("Avg engaged time", dur(k.avg_engaged_s * 1000), delta(k.avg_engaged_s, p.avg_engaged_s))}
      ${tile("Bounce rate", k.bounce_rate + "%", delta(k.bounce_rate, p.bounce_rate, true))}
      ${tile("Assessments done", num(k.assessments), delta(k.assessments, p.assessments))}
      ${tile("Leads", num(k.leads), delta(k.leads, p.leads))}
      ${tile("New people identified", num(k.new_people), delta(k.new_people, p.new_people))}
    </div>
    <div class="card" style="margin-top:16px">
      <div class="head"><h2 style="margin:0" id="tlabel">Sessions per day</h2>
        <div class="seg" id="metric"><button aria-pressed="true" data-k="sessions">Sessions</button><button aria-pressed="false" data-k="visitors">Visitors</button><button aria-pressed="false" data-k="page_views">Page views</button></div>
      </div>
      <div id="trend"></div>
    </div>
    <div class="grid g2">
      <div class="card"><h2>Channels</h2>${table(d.channels, [
        { k: "sessions", label: "Channel", bar: true, labelKey: "label" },
        { k: "sessions", label: "Sessions", n: true, fmt: num },
        { k: "converted", label: "Converted", n: true, fmt: (v, r) => `${num(v)} <span class="muted">(${r.sessions ? Math.round((100 * v) / r.sessions) : 0}%)</span>` },
      ])}<p class="muted" style="font-size:12.5px;margin:8px 0 0">Converted = the session submitted a form or finished an assessment.</p></div>
      <div class="card"><h2>Landing pages</h2>${table(d.landing, [
        { k: "sessions", label: "First page of the visit", bar: true, labelKey: "label" },
        { k: "sessions", label: "Sessions", n: true, fmt: num },
        { k: "bounce_rate", label: "Bounce", n: true, fmt: (v) => v + "%" },
        { k: "converted", label: "Conv.", n: true, fmt: num },
      ])}</div>
    </div>
    <div class="card" style="margin-top:16px"><h2>Pages</h2>${table(d.pages, [
      { k: "views", label: "Page", bar: true, labelKey: "label" },
      { k: "views", label: "Views", n: true, fmt: num },
      { k: "visitors", label: "Visitors", n: true, fmt: num },
      { k: "avg_engaged_s", label: "Avg time", n: true, fmt: (v) => (v == null ? "–" : dur(v * 1000)) },
      { k: "avg_scroll", label: "Avg scroll", n: true, fmt: (v) => (v == null ? "–" : v + "%") },
    ])}</div>
    <div class="grid g3">
      <div class="card"><h2>Devices</h2>${table(d.devices, [{ k: "sessions", label: "Device", bar: true, labelKey: "label" }, { k: "sessions", label: "Sessions", n: true, fmt: num }])}</div>
      <div class="card"><h2>Cities</h2>${table(d.cities, [{ k: "sessions", label: "City", bar: true, labelKey: "label" }, { k: "sessions", label: "Sessions", n: true, fmt: num }])}</div>
      <div class="card"><h2>Referring sites</h2>${table(d.referrers, [{ k: "sessions", label: "Site", bar: true, labelKey: "label" }, { k: "sessions", label: "Sessions", n: true, fmt: num }])}</div>
    </div>`;
  const labels = { sessions: "Sessions", visitors: "Visitors", page_views: "Page views" };
  const draw = (key) => { $("#tlabel").textContent = `${labels[key]} per day`; lineChart($("#trend"), d.daily, key, labels[key]); };
  $("#metric").addEventListener("click", (e) => {
    const b = e.target.closest("button"); if (!b) return;
    $("#metric").querySelectorAll("button").forEach((x) => x.setAttribute("aria-pressed", String(x === b)));
    draw(b.dataset.k);
  });
  draw("sessions");
}

// ---------- Assessments ----------
const pretty = (slug) => String(slug ?? "").replace(/^assessment-/, "").replace(/-/g, " ").replace(/\b\w/g, (c) => c.toUpperCase());
async function assessments() {
  const el = $('[data-panel="assessments"]');
  const d = await get("assessments");
  if (!d.funnel.length) { el.innerHTML = `<div class="card" style="margin-top:20px"><div class="empty">No assessment activity in this period yet.</div></div>`; return; }
  el.innerHTML = `<div class="grid g2">${d.funnel.map((f) => {
    const steps = d.steps.filter((s) => s.assessment === f.assessment);
    const top = Math.max(f.viewed, f.started, 1);
    const row = (label, n) => `<div class="frow"><span>${label}</span><div class="ftrack"><div class="ffill" style="width:${(100 * n) / top}%"></div></div><span class="n" style="text-align:right">${num(n)}</span></div>`;
    const results = d.results.filter((r) => r.assessment === f.assessment);
    const ab = d.abandons.filter((a) => a.assessment === f.assessment);
    return `<div class="card">
      <h2>${esc(pretty(f.assessment))}</h2>
      <div class="funnel">
        ${row("Opened page", f.viewed)}
        ${row("Started", f.started)}
        ${steps.map((s) => row(`Step ${s.step}/${s.total}`, s.sessions)).join("")}
        ${row("Completed", f.completed)}
      </div>
      <p class="muted" style="font-size:13px;margin:10px 0 0">Completion: <b>${f.started ? Math.round((100 * f.completed) / f.started) : 0}%</b> of starters${ab.length ? ` · most left at step ${ab.sort((a, b) => b.n - a.n)[0].step}` : ""}</p>
      ${results.length ? `<h3 style="margin-top:14px">Results given</h3>${table(results, [{ k: "n", label: "Outcome", bar: true, labelKey: "label" }, { k: "n", label: "People", n: true, fmt: num }, { k: "avg_overall", label: "Avg score", n: true, fmt: (v) => (v == null ? "–" : v) }])}` : ""}
    </div>`;
  }).join("")}</div>`;
}

// ---------- Behaviour ----------
async function behaviour() {
  const el = $('[data-panel="behaviour"]');
  const d = await get("behaviour");
  el.innerHTML = `
    <div class="grid g2">
      <div class="card"><h2>Searches</h2>${table(d.searches, [
        { k: "n", label: "Search term", bar: true, labelKey: "q" },
        { k: "where", label: "Where" },
        { k: "n", label: "Times", n: true, fmt: num },
        { k: "results", label: "Results", n: true, fmt: (v) => (v === 0 ? `<span class="down">0</span>` : num(v)) },
      ])}<p class="muted" style="font-size:12.5px;margin:8px 0 0">Searches with 0 results are content gaps.</p></div>
      <div class="card"><h2>Forms</h2>${table(d.forms, [
        { k: "started", label: "Form", bar: true, labelKey: "form" },
        { k: "started", label: "Started", n: true, fmt: num },
        { k: "submitted", label: "Submitted", n: true, fmt: num },
        { k: "submitted", label: "Rate", n: true, fmt: (v, r) => (r.started ? Math.round((100 * v) / r.started) + "%" : "–") },
      ])}</div>
      <div class="card"><h2>Pain map: where it hurts</h2>${table(d.painmap, [{ k: "n", label: "Body area picked", bar: true, labelKey: "label" }, { k: "n", label: "Picks", n: true, fmt: num }])}</div>
      <div class="card"><h2>Physio profiles contacted</h2>${table(d.physio, [{ k: "contacts", label: "Profile", bar: true, labelKey: "label" }, { k: "contacts", label: "Call / WhatsApp", n: true, fmt: num }, { k: "clicks", label: "All clicks", n: true, fmt: num }])}</div>
    </div>
    <div class="card" style="margin-top:16px"><h2>Outbound clicks</h2>${table(d.outbound, [
      { k: "n", label: "Destination", bar: true, labelKey: "url" },
      { k: "kind", label: "Type", fmt: (v) => `<span class="chip">${esc(v)}</span>` },
      { k: "n", label: "Clicks", n: true, fmt: num },
    ])}</div>
    <div class="grid g2">
      <div class="card"><h2>All events</h2>${table(d.events, [{ k: "n", label: "Event", bar: true, labelKey: "label" }, { k: "n", label: "Count", n: true, fmt: num }, { k: "sessions", label: "Sessions", n: true, fmt: num }])}</div>
      <div class="card"><h2>Slowest pages (p75)</h2>${table(d.vitals, [
        { k: "path", label: "Page" },
        { k: "metric", label: "Metric", fmt: (v) => `<span class="chip">${esc(v)}</span>` },
        { k: "p75", label: "p75", n: true, fmt: (v, r) => (r.metric === "CLS" ? Number(v).toFixed(3) : Math.round(v) + " ms") },
        { k: "n", label: "Samples", n: true, fmt: num },
      ])}
      <h2 style="margin-top:18px">JavaScript errors</h2>${table(d.errors, [{ k: "message", label: "Error", wrap: true }, { k: "path", label: "Page" }, { k: "n", label: "Count", n: true, fmt: num }])}</div>
    </div>`;
}

// ---------- Leads ----------
async function leads() {
  const el = $('[data-panel="leads"]');
  const d = await get("leads");
  const contact = (r) => [r.name, r.email, r.phone].filter(Boolean).map(esc).join(" · ") || "–";
  const src = (r) => [r.channel, r.utm_source, r.utm_campaign].filter(Boolean).map((x) => `<span class="chip">${esc(x)}</span>`).join(" ");
  el.innerHTML = `
    <div class="card" style="margin-top:20px"><div class="head"><h2 style="margin:0">Assessment results (${d.assessments.length})</h2><button class="seg" style="padding:6px 14px;cursor:pointer" data-csv="assessments">Download CSV</button></div><div id="la">${table(d.assessments, [
      { k: "created_at", label: "When", fmt: when },
      { k: "assessment", label: "Assessment", fmt: pretty },
      { k: "condition", label: "Result", fmt: (v, r) => esc(v ?? (r.scores?.overall != null ? `Score ${r.scores.overall}/10` : "–")) + (r.advisory ? ` <span class="chip down">advisory</span>` : "") },
      { k: "name", label: "Person", fmt: (v, r) => contact(r) },
      { k: "channel", label: "Came from", fmt: (v, r) => src(r) },
    ], { click: true })}</div></div>
    <div class="card" style="margin-top:16px"><div class="head"><h2 style="margin:0">Form leads (${d.leads.length})</h2><button class="seg" style="padding:6px 14px;cursor:pointer" data-csv="leads">Download CSV</button></div><div id="ll">${table(d.leads, [
      { k: "created_at", label: "When", fmt: when },
      { k: "form", label: "Form", fmt: (v) => `<span class="chip">${esc(v)}</span>` },
      { k: "name", label: "Person", fmt: (v, r) => contact(r) },
      { k: "path", label: "Page" },
      { k: "channel", label: "Came from", fmt: (v, r) => src(r) },
    ], { click: true })}</div></div>`;
  wireRows($("#la"), d.assessments, (r) => openJourney({ visitor: r.visitor_id }));
  wireRows($("#ll"), d.leads, (r) => openJourney({ visitor: r.visitor_id }));
  el.querySelectorAll("[data-csv]").forEach((b) => b.addEventListener("click", () => csv(d[b.dataset.csv], b.dataset.csv)));
}
function csv(rows, name) {
  if (!rows.length) return;
  const keys = Object.keys(rows[0]);
  const cell = (v) => `"${String(typeof v === "object" && v ? JSON.stringify(v) : v ?? "").replace(/"/g, '""')}"`;
  const blob = new Blob([[keys.join(","), ...rows.map((r) => keys.map((k) => cell(r[k])).join(","))].join("\n")], { type: "text/csv" });
  const a = Object.assign(document.createElement("a"), { href: URL.createObjectURL(blob), download: `betterhood-${name}-${new Date().toISOString().slice(0, 10)}.csv` });
  a.click(); URL.revokeObjectURL(a.href);
}

// ---------- Sessions ----------
async function sessions() {
  const el = $('[data-panel="sessions"]');
  const d = await get("sessions?limit=200");
  el.innerHTML = `<div class="card" style="margin-top:20px"><h2>Latest sessions</h2><div id="st">${table(d.sessions, [
    { k: "started_at", label: "Started", fmt: when },
    { k: "user_name", label: "Who", fmt: (v, r) => (r.user_email || r.user_phone || v ? `<b>${esc(v || r.user_email || r.user_phone)}</b>` : `<span class="muted">Anonymous</span>`) + (r.session_count > 1 ? ` <span class="chip">visit ${r.session_count}</span>` : "") },
    { k: "channel", label: "Source", fmt: (v, r) => [v, r.utm_source, r.utm_campaign].filter(Boolean).map((x) => `<span class="chip">${esc(x)}</span>`).join(" ") },
    { k: "landing_path", label: "Landed on" },
    { k: "page_views", label: "Pages", n: true, fmt: num },
    { k: "engaged_ms", label: "Time", n: true, fmt: dur },
    { k: "device_type", label: "Device", fmt: (v, r) => esc([v, r.os].filter(Boolean).join(" · ")) },
    { k: "city", label: "City" },
  ], { click: true })}</div></div>`;
  wireRows($("#st"), d.sessions, (r) => openJourney({ session: r.id }));
}

// ---------- Journey ----------
const KEY = new Set(["assessment_complete", "form_submit", "identify", "outbound_click", "assessment_start", "assessment_abandon"]);
function describe(e) {
  const p = e.props || {};
  switch (e.name) {
    case "page_view": return `Viewed <b>${esc(e.title || e.path)}</b> <span class="muted">${esc(e.path)}</span>`;
    case "page_leave": return `Left page after <b>${dur(p.engaged_ms)}</b> active, scrolled ${p.max_scroll ?? 0}%`;
    case "scroll_depth": return `Scrolled ${p.depth}%`;
    case "outbound_click": return `Clicked <b>${esc(p.kind)}</b> link → ${esc(p.url)}`;
    case "assessment_start": return `Started <b>${esc(pretty(p.assessment))}</b>`;
    case "assessment_step": return `Assessment step ${p.step}/${p.total}`;
    case "assessment_abandon": return `Left the assessment at step ${p.step}/${p.total}`;
    case "assessment_complete": return `Finished <b>${esc(pretty(p.assessment))}</b> → ${esc(p.condition || p.result || "scored")}`;
    case "form_start": return `Started filling <b>${esc(p.form)}</b>`;
    case "form_submit": return `Submitted <b>${esc(p.form)}</b>`;
    case "search": return `Searched “<b>${esc(p.q)}</b>” on ${esc(p.where)} (${p.results ?? "?"} results)`;
    case "painmap_select": return `Picked <b>${esc(p.spot)}</b> on the pain map`;
    case "section_view": return `Saw section <b>${esc(p.section)}</b>`;
    case "filter": return `Filtered ${esc(p.where)}: ${esc(Object.entries(p).filter(([k]) => k !== "where").map(([k, v]) => `${k}=${v}`).join(", "))}`;
    case "web_vital": return `${esc(p.metric)}: ${p.metric === "CLS" ? Number(p.value).toFixed(3) : Math.round(p.value) + " ms"}`;
    case "js_error": return `<span class="err">Error: ${esc(p.message)}</span>`;
    default: return `<b>${esc(e.name)}</b> ${Object.keys(p).length ? `<span class="muted">${esc(JSON.stringify(p))}</span>` : ""}`;
  }
}
async function openJourney(q) {
  select("journey");
  const out = $("#jout");
  out.innerHTML = `<div class="empty">Loading…</div>`;
  try {
    const r = await fetch(`/api/journey?${new URLSearchParams(q)}`);
    const d = await r.json();
    if (!r.ok) throw new Error(d.error);
    const quiet = new Set(["scroll_depth", "web_vital", "section_view"]);
    const byS = {};
    d.events.forEach((e) => (byS[e.session_id] ??= []).push(e));
    const who = d.person;
    out.innerHTML = `
      <div class="card" style="margin-top:16px">
        <h2>${who ? esc(who.name || who.email || who.phone) : "Anonymous visitor"}</h2>
        <p style="margin:0">${who ? [who.email, who.phone].filter(Boolean).map(esc).join(" · ") : "Not identified yet: they haven't submitted a form or assessment."}</p>
        <p class="muted" style="margin:6px 0 0;font-size:13.5px">${d.sessions.length} visit${d.sessions.length === 1 ? "" : "s"} on ${d.visitors.length} device${d.visitors.length === 1 ? "" : "s"} ·
          first seen ${when(d.visitors[0].first_seen_at)} via <b>${esc(d.visitors[0].first_channel || "direct")}</b>${d.visitors[0].first_source ? ` (${esc(d.visitors[0].first_source)}${d.visitors[0].first_campaign ? " / " + esc(d.visitors[0].first_campaign) : ""})` : ""} ·
          ${d.assessments.length} assessment${d.assessments.length === 1 ? "" : "s"} · ${d.leads.length} form${d.leads.length === 1 ? "" : "s"}</p>
        <label style="display:inline-flex;gap:6px;align-items:center;font-size:13px;margin-top:10px" class="muted"><input type="checkbox" id="showall" /> Show scroll, speed and section events</label>
      </div>
      ${d.assessments.map((a) => `<div class="card" style="margin-top:12px"><h3>${esc(pretty(a.assessment))} · ${when(a.created_at)}</h3>
        <p style="margin:0">${esc(a.condition || a.result || "")} ${a.advisory ? `<span class="chip down">advisory</span>` : ""} <span class="muted">${esc(JSON.stringify(a.scores))}</span></p>
        <details style="margin-top:6px"><summary>${a.answers.length} answers</summary>${table(a.answers, [{ k: "label", label: "Question", wrap: true }, { k: "value", label: "Answer", wrap: true, fmt: (v) => esc(Array.isArray(v) ? v.join(", ") : v) }])}</details></div>`).join("")}
      <h2 style="margin:24px 0 12px">Timeline</h2>
      <div id="tl">${[...d.sessions].reverse().map((s) => `<div class="sess">
        <header><b>${when(s.started_at)}</b>
          ${[s.channel, s.utm_source, s.utm_campaign].filter(Boolean).map((x) => `<span class="chip">${esc(x)}</span>`).join(" ")}
          <span class="muted" style="font-size:13px">${esc([s.device_type, s.os, s.browser, s.city].filter(Boolean).join(" · "))} · ${s.page_views} pages · ${dur(s.engaged_ms)}${s.referrer_host ? ` · from ${esc(s.referrer_host)}` : ""}</span></header>
        ${(byS[s.id] || []).map((e) => `<div class="ev ${KEY.has(e.name) ? "key" : ""}" ${quiet.has(e.name) ? "data-quiet hidden" : ""}><time>${hhmm(e.ts)}</time><div class="p">${describe(e)}</div></div>`).join("")}
      </div>`).join("")}</div>`;
    $("#showall").addEventListener("change", (e) => out.querySelectorAll("[data-quiet]").forEach((x) => (x.hidden = !e.target.checked)));
  } catch (err) {
    out.innerHTML = `<div class="card" style="margin-top:16px"><p class="err">${esc(err.message)}</p></div>`;
  }
}
$("#jform").addEventListener("submit", (e) => { e.preventDefault(); const q = $("#jq").value.trim(); if (q) openJourney({ q }); });

// ---------- tabs ----------
const loaders = { overview, assessments, behaviour, leads, sessions, journey: async () => {} };
let current = "overview";
function select(tab) {
  current = tab;
  document.querySelectorAll("[data-tab]").forEach((b) => b.setAttribute("aria-selected", String(b.dataset.tab === tab)));
  document.querySelectorAll("[data-panel]").forEach((p) => (p.hidden = p.dataset.panel !== tab));
  try { localStorage.setItem("bh_dash_tab", tab); } catch {}
}
async function load(tab) {
  select(tab);
  const el = $(`[data-panel="${tab}"]`);
  if (tab !== "journey") el.innerHTML = `<div class="empty">Loading…</div>`;
  try { await loaders[tab](); } catch (err) { el.innerHTML = `<div class="card" style="margin-top:20px"><p class="err">Couldn't load: ${esc(err.message)}</p></div>`; }
}
document.querySelectorAll("[data-tab]").forEach((b) => b.addEventListener("click", () => load(b.dataset.tab)));
daysSel.addEventListener("change", () => load(current));
let start = "overview";
try { start = localStorage.getItem("bh_dash_tab") || "overview"; } catch {}
load(loaders[start] ? start : "overview");
setInterval(() => fetch("/api/overview?days=1").then((r) => r.json()).then((d) => ($("#live").textContent = `${d.live} on site now`)).catch(() => {}), 60_000);
</script>
