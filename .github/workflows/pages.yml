name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
  # directory-updated: sent by the Betterhood API when a physio publishes or edits a directory listing (SITE_REBUILD_* there).
  # lab-published: sent by the SEO dashboard's Content Lab when a blog post is published, updated or unpublished.
  repository_dispatch:
    types: [directory-updated, lab-published]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    # PUBLIC_API_URL / PUBLIC_APP_URL are set as variables on the github-pages environment.
    environment: github-pages
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          PUBLIC_FORM_ENDPOINT: ${{ vars.PUBLIC_FORM_ENDPOINT }}
          PUBLIC_MEDIA_ORIGIN: ${{ vars.PUBLIC_MEDIA_ORIGIN }}
          PUBLIC_TRACK_ENDPOINT: ${{ vars.PUBLIC_TRACK_ENDPOINT }}
          PUBLIC_API_URL: ${{ vars.PUBLIC_API_URL || secrets.PUBLIC_API_URL }}
          PUBLIC_APP_URL: ${{ vars.PUBLIC_APP_URL || secrets.PUBLIC_APP_URL }}
          # Content Lab posts (scripts/sync-lab.mjs): the SEO dashboard's Supabase URL and publishable key
          LAB_SUPABASE_URL: ${{ vars.LAB_SUPABASE_URL }}
          LAB_SUPABASE_KEY: ${{ vars.LAB_SUPABASE_KEY }}
      # project pages are served from /<repo>/, so prefix root-relative URLs
      - run: node scripts/rebase-dist.mjs
        env:
          BASE_PATH: /${{ github.event.repository.name }}
      - run: touch dist/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
